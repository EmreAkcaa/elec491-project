[project]
name = "stonecal"
version = "0.1.0"
description = "StoNeCoAl – Stock Network Correlation Analysis for BIST-100"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    # plotly pinned <6 because plotly 6 + kaleido 1.x require a system Chrome
    # install for static-image export (fig.to_image). Streamlit Cloud has no
    # Chrome, so the export popover crashes with "Kaleido requires Google
    # Chrome to be installed". The 5.x line has every feature this project
    # uses; we lose nothing.
    "plotly>=5.22,<6",
    # Streamlit pinned EXACTLY to match requirements.txt and README.md
    # sdk_version. Loose pin (>=) caused a smoke-gate blind spot:
    # `uv sync` installed 1.54+ locally, where st.button accepts width=;
    # HF Spaces installs the pinned 1.41.1 where it doesn't, and the
    # sidebar crashed on every render after PR #23. See
    # docs/STREAMLIT_VERSION_BUMP.md.
    "streamlit==1.41.1",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "isyatirimhisse>=2.1",
    "networkx>=3.2",
    "scikit-learn>=1.5",
    "PyWavelets>=1.6",
    # kaleido pinned to the last 0.x release: it bundles its own Chromium
    # binary and works out of the box on Streamlit Cloud. kaleido 1.0+
    # delegates to a system Chrome install via plotly_get_chrome, which we
    # cannot trigger in the hosted environment. Do not bump above 0.2.x.
    "kaleido==0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
snn = [
    "torch>=2.0",
    "snntorch>=0.7",
]
eeg = [
    "mne>=1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
