[project]
name = "stonecal"
version = "0.1.0"
description = "StoNeCoAl – Stock Network Correlation Analysis for BIST-100"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "plotly>=5.22",
    "streamlit>=1.35",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "isyatirimhisse>=2.1",
    "networkx>=3.2",
    "scikit-learn>=1.5",
    "PyWavelets>=1.6",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
