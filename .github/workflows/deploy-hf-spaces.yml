name: Deploy to Hugging Face Spaces

# Mirrors GitHub `main` → the configured HF Space repo on every push.
#
# Uses huggingface_hub.upload_folder() (HTTP-based) rather than `git push`
# because HF Spaces enforces a hard **10 MiB per non-LFS file** limit (much
# stricter than GitHub's 100 MB). The Hub API auto-LFSes large files on the
# fly, doesn't care about historical git-blob sizes, and lets us exclude
# pipeline-only files (data/<u>/raw/) that the dashboard never reads.
#
# Required GitHub configuration:
#   - Environment "top" with secret HF_DEPLOY_TOKEN
#       Token type:  Write
#       Source:      https://huggingface.co/settings/tokens
#   - Repository variable HF_SPACE_REPO
#       Format:      <hf-username-or-org>/<space-name>
#       Example:     FlyingSubmarine33/stonecoale

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-spaces-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Push to HF Space
    runs-on: ubuntu-latest
    environment: top

    steps:
      - name: Verify HF_SPACE_REPO is configured
        run: |
          if [ -z "${{ vars.HF_SPACE_REPO }}" ]; then
            echo "::error::Repository variable HF_SPACE_REPO is not set."
            echo ""
            echo "Add it under: Settings → Secrets and variables → Actions → Variables tab"
            echo "Format:       <hf-username-or-org>/<space-name>"
            echo "Example:      FlyingSubmarine33/stonecoale"
            exit 1
          fi
          echo "Deploy target: https://huggingface.co/spaces/${{ vars.HF_SPACE_REPO }}"

      - name: Checkout repo (with LFS objects materialised)
        uses: actions/checkout@v4
        with:
          # LFS-tracked files (EEG processed parquets) become real bytes on
          # the runner so huggingface_hub can upload them through HF's own
          # LFS service rather than as pointer stubs.
          lfs: true
          fetch-depth: 1   # we only need the current tree, not history

      - name: Set up Git LFS (belt-and-suspenders)
        # actions/checkout's lfs:true should have done this, but reactivating
        # the smudge/clean filters + a second pull guarantees the LFS files
        # are full bytes on disk before huggingface_hub reads them.
        run: |
          git lfs install
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub client
        run: pip install --upgrade "huggingface_hub>=0.24"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN:       ${{ secrets.HF_DEPLOY_TOKEN }}
          HF_SPACE_REPO:  ${{ vars.HF_SPACE_REPO }}
          GITHUB_SHA:     ${{ github.sha }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_DEPLOY_TOKEN is empty (not visible to environment 'top')."
            echo "Add a Write-scope token at: https://huggingface.co/settings/tokens"
            echo "Then set it under: Settings → Environments → top → Add secret HF_DEPLOY_TOKEN"
            exit 1
          fi

          python <<'PYEOF'
          import os
          from huggingface_hub import HfApi, CommitOperationDelete

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_SPACE_REPO"]
          commit_sha = os.environ["GITHUB_SHA"][:7]

          # Patterns we DON'T want to ship to HF Spaces. The dashboard never
          # reads these; including them just wastes upload bandwidth + storage
          # + trips the 10 MiB-per-file size hook for non-LFS blobs.
          ignore_patterns = [
              # VCS internals
              ".git/**",
              ".github/**",
              ".gitattributes",
              ".gitignore",
              ".idea/**",
              ".vscode/**",
              ".claude/**",
              # Build / cache / lock
              "**/__pycache__/**",
              "**/*.pyc",
              "**/.DS_Store",
              "uv.lock",
              ".uv-build-tools-cache/**",
              # Dev-only assets
              "tests/**",
              "notebooks/**",
              "scripts/**",
              # Pipeline-only raw inputs (~10 MB+ each; dashboard reads
              # data/<u>/processed/ and data/<u>/results/ only)
              "data/*/raw/**",
              # OS junk
              "*.iml",
              "stonecal.iml",
          ]

          # First push to a freshly-created Streamlit Space: it ships with a
          # boilerplate `app.py` + `README.md`. Our upload_folder will overlay
          # but leave the old files in place. Force a clean upload by deleting
          # the boilerplate first (safe to call repeatedly — missing-file
          # delete is a no-op).
          try:
              api.delete_file(
                  path_in_repo="app.py",
                  repo_id=repo_id, repo_type="space",
                  commit_message=f"Remove boilerplate app.py (deploy {commit_sha})",
              )
              print("Removed boilerplate app.py from Space")
          except Exception as e:
              # app.py may not exist (already deleted, or never present); fine
              print(f"app.py delete skipped: {e}")

          # Push the curated tree. huggingface_hub auto-LFSes any file
          # larger than ~10 MB regardless of how it's tracked on the git
          # side — no .gitattributes plumbing needed for HF's side.
          print(f"Uploading folder to space '{repo_id}'...")
          commit_info = api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              commit_message=f"Deploy from GitHub commit {commit_sha}",
              ignore_patterns=ignore_patterns,
              # `allow_patterns` left None → upload everything not ignored
          )
          print(f"OK. Commit URL: {commit_info.commit_url}")
          PYEOF

      - name: Summary
        if: success()
        run: |
          echo "::notice::Deployed GitHub commit ${{ github.sha }}"
          echo "::notice::HF Space:  https://huggingface.co/spaces/${{ vars.HF_SPACE_REPO }}"
          echo "::notice::Build log: https://huggingface.co/spaces/${{ vars.HF_SPACE_REPO }}/logs"

      - name: Failure hint
        if: failure()
        run: |
          echo "::error::HF Spaces deploy failed. Common causes:"
          echo "  1. HF_DEPLOY_TOKEN is wrong scope (need Write, not Read)"
          echo "  2. HF_SPACE_REPO points at a Space that doesn't exist"
          echo "     (create it first at https://huggingface.co/new-space — SDK: Streamlit)"
          echo "  3. Space was created with SDK: docker instead of streamlit;"
          echo "     delete + recreate it as Streamlit-SDK to fix"
          echo "  4. A file > 10 MiB slipped through ignore_patterns:"
          echo "     check the upload step output for which file HF rejected,"
          echo "     then add its glob to ignore_patterns in this workflow."
