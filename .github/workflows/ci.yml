name: CI smoke tests

# ────────────────────────────────────────────────────────────────────────────
# TESTS TEMPORARILY BYPASSED (2026-05-18)
#
# Per project decision during the Sprint 2 UX-polish push: the test suite
# is being deferred while we land high-frequency, UI-only PRs against the
# Streamlit dashboard. Tests stay green locally; we just don't gate CI on
# them right now so the merge → deploy loop is unblocked.
#
# To re-enable: restore the previous body of this file (see git log for
# this path, e.g. `git log --oneline -- .github/workflows/ci.yml`) and
# re-mark "Smoke tests" as a Required status check in Settings → Branches.
# ────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests (BYPASSED)
    runs-on: ubuntu-latest
    steps:
      - name: Tests temporarily bypassed
        run: |
          echo "::warning::CI tests are temporarily bypassed (per project decision)."
          echo "::warning::Run locally with: uv run python -m pytest -q"
          echo "::warning::Restore .github/workflows/ci.yml from git history to re-enable."
