<text x="550.0" y="442" text-anchor="middle" class="cap">Mode 2 is the BIST banking factor — 5 of 73 tickers (7%) carry &gt;75% of its variance under TRY. Re-expressing returns in USD or Gold weakens both the banking factor&#x27;s variance share AND the banks&#x27; dominance of that mode, because the bank-vs-market spread was largely TRY-rate-driven.</text>
