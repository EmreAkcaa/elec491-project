# BIST 100 in Gold (XAU/TRY) numéraire — generated by
# scripts/run_basis_variants.py from the BIST settings.

market:
  market_id: "bist_gold"
  universe_file: "config/universes/bist100.csv"
  index_ticker: "XU100"
  provider_suffix: ".IS"
  currency: "XAU"        # gold-denominated

data:
  start_date: "2020-01-01"
  end_date: "2026-03-01"
  download_interval: "1d"
  store_raw_close: true

preprocessing:
  min_coverage_pct: 0.90
  anomaly_return_threshold: 0.30
  forward_fill: false
  manual_anomaly_nulls:
    - ["CCOLA", "2024-08-01"]
    - ["HEKTS", "2024-09-09"]
    - ["HEKTS", "2021-04-30"]
    - ["AYGAZ", "2022-09-01"]

analysis:
  correlation_method: "pearson"
  annualization_factor: 252
  corr_min_periods: 200

validation:
  enabled: false
  sample_size: 10

rolling:
  windows: [60, 120, 252]
  step: 5
  method: "pearson"
  min_periods_ratio: 0.6

dislocation:
  zscore_window: 60
  entry_zscore: 2.0
  exit_zscore: 0.5
  min_half_life: 5
  max_half_life: 252
  top_n_candidates: 20
  lookback_window: 252
  min_correlation: 0.5

clustering:
  linkage_method: "ward"
  n_clusters: 20
  criterion: "maxclust"
  distance_threshold: 1.0

transfer_entropy:
  lag: 1
  n_bins: 3
  significance_shuffles: 100
  significance_level: 0.05
  seed: 42
  surrogate_block_length: 5
  multiple_testing: "fdr_bh"
