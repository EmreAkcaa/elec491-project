market:
  market_id: "BIST"
  universe_file: "config/universes/bist100.csv"
  index_ticker: "XU100"
  provider_suffix: ".IS"
  currency: "TRY"

data:
  start_date: "2020-01-01"
  end_date: "2026-03-01"
  download_interval: "1d"
  store_raw_close: true

preprocessing:
  min_coverage_pct: 0.90
  anomaly_return_threshold: 0.30
  forward_fill: false
  # Unhandled yfinance Adj-Close back-adjustment failures on Borsa Istanbul.
  # Each (ticker, date) cell in log_returns is set to NaN before anomaly
  # detection runs. Audited 2026-05-17 by inspecting pre/post prices.
  manual_anomaly_nulls:
    - ["CCOLA", "2024-08-01"]   # 828.44 -> 76.65 (10.81x bonus issue)
    - ["HEKTS", "2024-09-09"]   # 11.76 -> 4.13 (2.84x bonus issue)
    - ["HEKTS", "2021-04-30"]   # 1.62 -> 2.33 (1.45x bonus issue, opposite sign)
    - ["AYGAZ", "2022-09-01"]   # 21.18 -> 36.54 (1.72x bonus issue, opposite sign)

analysis:
  correlation_method: "pearson"
  annualization_factor: 252
  corr_min_periods: 200

validation:
  enabled: true
  sample_size: 10

rolling:
  windows: [60, 120, 252]
  step: 5
  method: "pearson"
  min_periods_ratio: 0.6

dislocation:
  zscore_window: 60
  entry_zscore: 2.0
  exit_zscore: 0.5
  min_half_life: 5
  max_half_life: 252
  top_n_candidates: 20
  lookback_window: 252
  min_correlation: 0.5

transfer_entropy:
  lag: 1
  n_bins: 3
  significance_shuffles: 100
  significance_level: 0.05
  seed: 42
