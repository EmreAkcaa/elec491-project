market:
  market_id: "BIST"
  universe_file: "config/universes/bist100.csv"
  index_ticker: "XU100"
  provider_suffix: ".IS"
  currency: "TRY"

data:
  start_date: "2020-01-01"
  end_date: "2026-03-01"
  download_interval: "1d"
  store_raw_close: true

preprocessing:
  min_coverage_pct: 0.90
  anomaly_return_threshold: 0.30
  forward_fill: false

analysis:
  correlation_method: "pearson"
  annualization_factor: 252
  corr_min_periods: 200

validation:
  enabled: true
  sample_size: 10

rolling:
  windows: [60, 120, 252]
  step: 5
  method: "pearson"
  min_periods_ratio: 0.6

dislocation:
  zscore_window: 60
  entry_zscore: 2.0
  exit_zscore: 0.5
  min_half_life: 5
  max_half_life: 252
  top_n_candidates: 20
  lookback_window: 252
  min_correlation: 0.5

transfer_entropy:
  lag: 1
  n_bins: 3
  significance_shuffles: 100
  significance_level: 0.05
  seed: 42
