market:
  market_id: "BIST"
  universe_file: "config/universes/bist100.csv"
  index_ticker: "XU100"
  provider_suffix: ".IS"
  currency: "TRY"

data:
  start_date: "2020-01-01"
  end_date: "2026-03-01"
  download_interval: "1d"
  store_raw_close: true

preprocessing:
  min_coverage_pct: 0.90
  anomaly_return_threshold: 0.30
  forward_fill: false
  # Unhandled yfinance Adj-Close back-adjustment failures on Borsa Istanbul.
  # Schema (per entry):
  #   2-tuple [ticker, "YYYY-MM-DD"]
  #       Null only the log_returns cell. Leaves the cliff in adj_close.
  #       (Legacy behavior — `compute_spread` reading np.log(adj_close)
  #        still sees the discontinuity.)
  #   3-tuple [ticker, "YYYY-MM-DD", ratio]
  #       ALSO back-adjust adj_close BEFORE compute_log_returns runs.
  #         ratio > 0   missed-split case   (pre-event /= ratio)
  #         ratio < 0   over-adjusted case  (pre-event *= |ratio|)
  #       Closes the demo-day risk in Pair Analysis Spread/Z-score (was
  #       showing ~6σ Z-score spike on CCOLA pairs for 3-4 months
  #       following the split). Audit log written to
  #       data/<market>/processed/applied_split_adjustments.csv.
  #
  # All four entries below upgraded to 3-tuples on 2026-05-19.
  # Ratios derived from the documented Close jumps in the comments.
  manual_anomaly_nulls:
    - ["CCOLA", "2024-08-01", 10.81]   # 828.44 -> 76.65 (10.81x bonus issue)
    - ["HEKTS", "2024-09-09", 2.84]    # 11.76 -> 4.13 (2.84x bonus issue)
    - ["HEKTS", "2021-04-30", -1.45]   # 1.62 -> 2.33 (1.45x bonus, opposite sign — over-adjusted)
    - ["AYGAZ", "2022-09-01", -1.72]   # 21.18 -> 36.54 (1.72x bonus, opposite sign — over-adjusted)

analysis:
  correlation_method: "pearson"
  annualization_factor: 252
  corr_min_periods: 200

validation:
  enabled: true
  sample_size: 10

rolling:
  windows: [60, 120, 252]
  step: 5
  method: "pearson"
  min_periods_ratio: 0.6

dislocation:
  zscore_window: 60
  entry_zscore: 2.0
  exit_zscore: 0.5
  min_half_life: 5
  max_half_life: 252
  top_n_candidates: 20
  lookback_window: 252
  min_correlation: 0.5

clustering:
  # Switched 2026-05-17 from single+distance_threshold=1.0 to ward+n_clusters=20
  # via maxclust. Single linkage produced chaining: 45 of 73 BIST tickers fell
  # into one mega-cluster spanning 17 sectors, breaking the proposal-promised
  # "banks cluster together" sanity check. Ward keeps the cluster sizes
  # balanced and recovers sector structure (banks, conglomerates, energy,
  # steel separate). If a future result needs single-linkage chaining for
  # comparison purposes, set linkage_method=single and criterion=distance.
  linkage_method: "ward"
  n_clusters: 20
  criterion: "maxclust"
  distance_threshold: 1.0  # only used when criterion=distance

transfer_entropy:
  lag: 1
  n_bins: 3
  significance_shuffles: 100
  significance_level: 0.05
  seed: 42
  # Block length for the circular-block-bootstrap surrogate (preserves source
  # autocorrelation). 5 ≈ one trading week for daily returns. The previous
  # i.i.d. permutation null (block_length=1) destroyed autocorrelation and
  # inflated significance — see KNOWN_ISSUES.md M-1.
  surrogate_block_length: 5
  # Multiple-testing correction across the N*(N-1) directed pairs. Without
  # this, ~5% of pairs appear significant at alpha=0.05 by construction
  # (e.g. ~263 false positives on the 73-ticker BIST grid). "fdr_bh" =
  # Benjamini–Hochberg (default); "bonferroni"/"none" also supported.
  multiple_testing: "fdr_bh"
